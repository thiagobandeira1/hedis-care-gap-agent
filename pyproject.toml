[project]
name = "hedis-care-gap-agent"
version = "0.1.0"
description = "LangGraph multi-agent HEDIS care-gap closure: deterministic measure engine + validation, care-action drafting, and human-in-the-loop approval over synthetic (Synthea) patients."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thiago Bandeira", email = "thiagobatistanb@gmail.com" }]
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.39",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "typer>=0.12",
    "clinical-agent-evals",
    "fhir-feature-service",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "respx>=0.23.1",
]

[project.scripts]
caregap = "caregap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caregap"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["caregap"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# fhir_features (P6 v0.1.0) ships no py.typed; P1 wraps it behind typed models anyway.
module = ["streamlit.*", "langgraph.*", "fhir_features.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=caregap --cov-report=term-missing"
markers = [
    "llm: needs a real ANTHROPIC key (auto-skipped in CI)",
    "p6: needs a running fhir-feature-service (auto-skipped when unavailable)",
]

[tool.coverage.run]
source = ["src/caregap"]

[tool.uv.sources]
clinical-agent-evals = { git = "https://github.com/thiagobandeira1/clinical-agent-evals", rev = "v0.1.0" }
fhir-feature-service = { git = "https://github.com/thiagobandeira1/fhir-feature-service", rev = "v0.1.0" }
