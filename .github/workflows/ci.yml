name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type-check (mypy)
        run: uv run mypy
      - name: Tests (keyless — every graph path under a fake model)
        run: uv run pytest
      - name: Gap-detection eval ratchet gate (keyless, recorded outputs)
        run: uv run caregap eval --gate
      - name: README eval table matches committed artifact
        run: |
          uv run caregap report
          git diff --exit-code README.md
      - name: Guard — no data files or secrets tracked
        run: |
          if git ls-files | grep -E '\.(csv|tsv|parquet|db|duckdb|sqlite|sqlite3)$|^\.env$'; then
            echo "::error::Data files or .env are committed"; exit 1
          fi
          echo "OK"
